[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-timebox"
version = "0.0.0"
dependencies = ["keyring", "requests"]
requires-python = ">=3.10"

[project.scripts]
timebox-cached = "timebox.commands.favorites:cached"
timebox-favorites = "timebox.commands.favorites:fetch"
timebox-projects = "timebox.commands.projects:main"
timebox-trigger = "timebox.commands.trigger:main"
timebox-start = "timebox.commands.start:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint] # https://beta.ruff.rs/docs/rules/
select = [
    "C",       # Complexity
    "E",       # pycodestyle
    "F",       # Unused imports
    "I",       # isort
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "S103",    # bad-file-permissions
    "TRY004",  # Prefer TypeError exception for invalid type
    "UP",      # pyupgrade
    "W",       # pycodestyle
]
ignore = [
    "E501", # Don't enforce line length for now
    "E741", # Ambiguous variable name
]
